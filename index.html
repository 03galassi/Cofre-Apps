<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cofre">
<title>Cofre de Acessos</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   COFRE DE ACESSOS — visual colorido
   Fontes (todas pensadas para leitura fácil):
     • Lexend ............... títulos (criada para facilitar a leitura)
     • Atkinson Hyperlegible  textos (criada para pessoas com baixa visão)
     • JetBrains Mono ....... senhas, logins e URLs (0/O e 1/l bem diferentes)
   Escala de texto: 13 · 14 · 16 · 18 · 22 · 28–36 px
   ===================================================================== */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --bg:#f7f4ff; --surface:#ffffff; --surface-2:#f5f2ff; --line:#e3dcf8;
  --fg:#1e1a3c; --muted:#5b5679;
  --violet:#7c3aed; --pink:#db2777; --orange:#ea580c; --teal:#0d9488; --sky:#0284c7; --amber:#d97706;
  --accent:#6d28d9; --accent-fg:#ffffff; --danger:#dc2647; --ok:#047857;
  --grad:linear-gradient(115deg,#7c3aed 0%,#db2777 50%,#f97316 100%);
  --rainbow:conic-gradient(from var(--ang),#7c3aed,#ec4899,#f97316,#eab308,#14b8a6,#0ea5e9,#7c3aed);
  --shadow-sm:0 2px 8px rgba(76,46,160,.08);
  --shadow:0 12px 32px rgba(76,46,160,.13),0 2px 6px rgba(76,46,160,.06);
  --shadow-lg:0 26px 64px rgba(76,46,160,.24);
  --blob-a:rgba(124,58,237,.26); --blob-b:rgba(236,72,153,.20); --blob-c:rgba(20,184,166,.20); --blob-d:rgba(249,115,22,.18);
  --f-display:"Lexend",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120e24; --surface:#1c1736; --surface-2:#262049; --line:#3a3266;
  --fg:#f5f2ff; --muted:#bdb5e0;
  --violet:#a78bfa; --pink:#f472b6; --orange:#fb923c; --teal:#2dd4bf; --sky:#38bdf8; --amber:#fbbf24;
  --accent:#b69cff; --accent-fg:#1a1238; --danger:#ff6b8a; --ok:#34d399;
  --shadow-sm:0 2px 8px rgba(0,0,0,.3); --shadow:0 12px 32px rgba(0,0,0,.4); --shadow-lg:0 26px 64px rgba(0,0,0,.55);
  --blob-a:rgba(124,58,237,.35); --blob-b:rgba(236,72,153,.22); --blob-c:rgba(20,184,166,.20); --blob-d:rgba(249,115,22,.16);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120e24; --surface:#1c1736; --surface-2:#262049; --line:#3a3266;
  --fg:#f5f2ff; --muted:#bdb5e0;
  --violet:#a78bfa; --pink:#f472b6; --orange:#fb923c; --teal:#2dd4bf; --sky:#38bdf8; --amber:#fbbf24;
  --accent:#b69cff; --accent-fg:#1a1238; --danger:#ff6b8a; --ok:#34d399;
  --shadow-sm:0 2px 8px rgba(0,0,0,.3); --shadow:0 12px 32px rgba(0,0,0,.4); --shadow-lg:0 26px 64px rgba(0,0,0,.55);
  --blob-a:rgba(124,58,237,.35); --blob-b:rgba(236,72,153,.22); --blob-c:rgba(20,184,166,.20); --blob-d:rgba(249,115,22,.16);
  color-scheme:dark}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;overflow-x:hidden;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* manchas de cor animadas no fundo */
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(60px)}
body::before{width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle,var(--blob-a),transparent 65%),radial-gradient(circle at 80% 80%,var(--blob-b),transparent 60%);animation:drift 22s ease-in-out infinite alternate}
body::after{width:55vmax;height:55vmax;right:-20vmax;bottom:-22vmax;background:radial-gradient(circle,var(--blob-c),transparent 62%),radial-gradient(circle at 20% 20%,var(--blob-d),transparent 60%);animation:drift 26s ease-in-out infinite alternate-reverse}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-3vmax,8vmax) scale(.95)}}
.wrap{position:relative;z-index:1;width:min(100%,1040px);margin-inline:auto;padding:18px clamp(14px,3vw,28px) calc(56px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:14px}
.hint{font-size:14px;color:var(--muted);line-height:1.5}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}

/* ---------- botões ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 20px;border:0;border-radius:14px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.005em;color:#fff;background:var(--grad);background-size:200% 100%;background-position:0 0;box-shadow:0 10px 22px -8px rgba(219,39,119,.55);transition:background-position .6s ease,transform .2s ease,box-shadow .2s ease}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s ease}
.btn:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:0 16px 28px -10px rgba(219,39,119,.6)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.6;cursor:default;transform:none}
.btn svg{width:19px;height:19px;flex:none}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--violet);color:var(--violet)}
.btn.danger{background:linear-gradient(115deg,#e11d48,#f97316);box-shadow:0 10px 22px -8px rgba(225,29,72,.55)}
.btn.light{background:#fff;color:#6d28d9;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
.btn.light:hover{background:#fff;color:#db2777}
.link{background:none;border:0;padding:0;color:var(--violet);font-weight:700;font-size:15px;text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:2px;text-underline-offset:4px}
.link:hover{color:var(--pink)}
.icon-btn{position:relative;overflow:hidden;display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--muted);transition:color .2s,background .2s,border-color .2s,transform .2s}
.icon-btn svg{width:19px;height:19px}
.icon-btn:hover{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 45%,transparent);background:color-mix(in srgb,var(--violet) 10%,var(--surface));transform:translateY(-2px) rotate(-4deg)}
.icon-btn.del:hover{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards}
.icon-btn .ripple,.btn.ghost .ripple{background:color-mix(in srgb,var(--violet) 30%,transparent)}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* ---------- campos ---------- */
.field{display:grid;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--fg)}
.input{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.input:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px color-mix(in srgb,var(--violet) 18%,transparent),0 6px 18px -6px color-mix(in srgb,var(--pink) 45%,transparent)}
.input input,.input textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);padding:12px 14px;font-size:16px;outline:none}
.input textarea{min-height:110px;resize:vertical;line-height:1.55}
.input input.mono{font-size:15px}
.input .pre{padding-left:14px;color:var(--muted);font-family:var(--f-mono);font-size:14px;white-space:nowrap}
.input .pre + input{padding-left:2px}
.input .icon-btn{border:0;background:transparent;margin-right:4px;width:38px;height:38px}
.input .icon-btn:hover{transform:none}
.search{flex:1 1 260px}
.search .pre svg{width:18px;height:18px;vertical-align:-4px;color:var(--violet)}
.msg{font-size:15px;border-radius:12px;padding:10px 14px;line-height:1.5}
.msg.err{color:var(--danger);background:color-mix(in srgb,var(--danger) 11%,transparent);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.msg.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}

/* ---------- tela de entrada ---------- */
.lock{min-height:calc(100dvh - 40px);display:grid;place-items:center;padding:12px 0}
.lock-card{position:relative;width:100%;max-width:430px;display:grid;gap:18px;padding:30px 26px;border-radius:28px;border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--rainbow) border-box;box-shadow:var(--shadow-lg);animation:spin 8s linear infinite}
@keyframes spin{to{--ang:360deg}}
.dial-wrap{display:grid;place-items:center}
.dial{width:128px;height:128px;filter:drop-shadow(0 10px 18px rgba(124,58,237,.3));animation:bob 4s ease-in-out infinite}
.dial .ring{transition:transform .45s cubic-bezier(.3,1.5,.5,1);transform-origin:60px 60px}
@keyframes bob{50%{transform:translateY(-6px)}}
.brand{text-align:center;display:grid;gap:6px}
.brand h1{font-size:30px}
.brand p{color:var(--muted);font-size:16px}
.back{display:inline-flex;align-items:center;gap:6px;width:fit-content;background:none;border:0;padding:4px 0;color:var(--violet);font-weight:700;font-size:15px}
.back svg{width:19px;height:19px;transition:transform .2s}
.back:hover svg{transform:translateX(-4px)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:8px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;margin-bottom:22px;border-radius:20px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:var(--shadow-sm)}
.top .who{display:flex;align-items:center;gap:12px;min-width:0}
.top .mark{width:44px;height:44px;flex:none;border-radius:14px;box-shadow:0 6px 16px -4px rgba(124,58,237,.5);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.top .mark:hover{transform:rotate(-12deg) scale(1.08)}
.top h1{font-size:20px}
.top .sub{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .actions{display:flex;gap:8px}

/* ---------- destaque (início) ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;display:grid;gap:14px;padding:28px 26px;margin-bottom:22px;border-radius:28px;color:#fff;background:linear-gradient(120deg,#6d28d9,#c026d3 35%,#db2777 65%,#f97316);background-size:220% 220%;animation:flow 14s ease infinite;box-shadow:var(--shadow-lg)}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{width:260px;height:260px;right:-70px;top:-110px;animation:float 9s ease-in-out infinite}
.hero::after{width:150px;height:150px;right:120px;bottom:-80px;background:rgba(255,214,102,.22);animation:float 7s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-14px,16px) scale(1.06)}}
.hero .eyebrow{font-family:var(--f-display);font-size:15px;font-weight:500;opacity:.92;display:flex;align-items:center;gap:8px}
.hero .wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}
.hero h2{font-size:clamp(28px,5.4vw,38px);font-weight:700}
.hero p{font-size:17px;opacity:.95;max-width:560px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-weight:700;font-size:15px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip b{font-family:var(--f-display);font-size:17px}
.chip svg{width:17px;height:17px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}

/* ---------- lista ---------- */
.list-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.list-head h2{font-size:clamp(24px,4.4vw,30px);flex:1;min-width:180px}
.count-pill{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--violet) 25%,transparent);padding:6px 12px;border-radius:999px;white-space:nowrap}
.rows{display:grid;gap:14px}
.c0{--ca:#7c3aed;--cb:#c026d3}
.c1{--ca:#0d9488;--cb:#059669}
.c2{--ca:#ea580c;--cb:#e11d48}
.c3{--ca:#0284c7;--cb:#4f46e5}
.c4{--ca:#db2777;--cb:#c026d3}
.c5{--ca:#4f46e5;--cb:#0891b2}
.row{position:relative;overflow:hidden;display:grid;gap:14px;padding:18px 18px 18px 24px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--ca,#7c3aed),var(--cb,#db2777))}
.row::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ca,#7c3aed) 16%,transparent),transparent 70%);pointer-events:none;transition:transform .4s ease}
.row:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--ca,#7c3aed) 35%,var(--line))}
.row:hover::after{transform:scale(1.4)}
.row h3{font-size:20px}
.row-top{display:flex;align-items:center;gap:14px}
.avatar{width:50px;height:50px;flex:none;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));box-shadow:0 8px 16px -6px var(--ca);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.row:hover .avatar{transform:rotate(-8deg) scale(1.06)}
.row-title{flex:1;min-width:0;display:grid;gap:2px}
.row-title strong{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.row-title a{width:fit-content;font-family:var(--f-mono);font-size:14px;color:var(--ca);text-decoration:none;overflow-wrap:anywhere;border-bottom:2px solid transparent;transition:border-color .2s}
:root[data-theme="dark"] .row-title a{color:color-mix(in srgb,var(--ca) 55%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row-title a{color:color-mix(in srgb,var(--ca) 55%,#fff)}}
.row-title a:hover{border-bottom-color:currentColor}
.row-actions{display:flex;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kv .cell,.note{position:relative;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:6px;min-width:0;background:color-mix(in srgb,var(--ca,#7c3aed) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--ca,#7c3aed) 16%,transparent);transition:background .3s,box-shadow .3s}
.kv .cell .txt,.note .txt{flex:1;min-width:0;display:grid;gap:1px}
.kv .cell .k,.note .k{font-family:var(--f-display);font-size:13px;font-weight:600;color:color-mix(in srgb,var(--ca,#7c3aed) 75%,var(--fg))}
:root[data-theme="dark"] .kv .cell .k,:root[data-theme="dark"] .note .k{color:color-mix(in srgb,var(--ca) 45%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kv .cell .k,:root:not([data-theme="light"]) .note .k{color:color-mix(in srgb,var(--ca) 45%,#fff)}}
.kv .cell .v{font-family:var(--f-mono);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .cell .icon-btn,.note .icon-btn{width:36px;height:36px;border:0;background:transparent}
.note{align-items:flex-start;background:color-mix(in srgb,#eab308 12%,var(--surface));border:1px dashed color-mix(in srgb,#ca8a04 50%,transparent)}
.note .k{display:flex;align-items:center;gap:6px;color:color-mix(in srgb,#a16207 85%,var(--fg))}
.note .k svg{width:16px;height:16px}
.note .v{font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.cell.flash,.note.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 22%,var(--surface))}100%{box-shadow:0 0 0 14px transparent}}
.empty{display:grid;gap:12px;justify-items:center;text-align:center;padding:40px 20px;border-radius:24px;border:2px dashed color-mix(in srgb,var(--violet) 35%,var(--line));background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--muted)}
.empty .ic{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 14px 28px -10px rgba(219,39,119,.6);animation:bob 3.5s ease-in-out infinite}
.empty .ic svg{width:34px;height:34px}
.empty h3{color:var(--fg);font-size:22px}
.empty p{font-size:16px;max-width:420px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-size:15px;background:color-mix(in srgb,var(--danger) 10%,transparent);border:1px solid color-mix(in srgb,var(--danger) 28%,transparent);animation:pop .3s ease}
.confirm span{flex:1;min-width:180px}
.settings .row{gap:12px}
.settings .row p{font-size:16px;color:var(--muted)}

/* ---------- janela de cadastro ---------- */
.scrim{position:fixed;inset:0;z-index:30;display:grid;place-items:end center;overflow-y:auto;overscroll-behavior:contain;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(24,14,58,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease}
@media (min-width:640px){.scrim{place-items:center}}
.sheet{position:relative;overflow:auto;width:100%;max-width:560px;max-height:min(90dvh,880px);display:grid;gap:16px;padding:26px 24px 22px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--grad);background-size:200% 100%;animation:shine 4s linear infinite}
.sheet h3{font-size:24px;display:flex;align-items:center;gap:10px}
.sheet h3 .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--grad)}
.sheet h3 .ic svg{width:21px;height:21px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}

/* ---------- aviso flutuante ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 28px);padding:12px 20px 12px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:15px;background:linear-gradient(115deg,#7c3aed,#db2777);box-shadow:0 16px 36px -10px rgba(124,58,237,.6);transform:translateX(-50%);animation:toastIn .45s cubic-bezier(.2,1.5,.4,1)}
.toast .tick{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25)}
.toast .tick svg{width:15px;height:15px}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,20px) scale(.95)}}
.confetti{position:fixed;z-index:60;width:10px;height:14px;border-radius:3px;pointer-events:none}

/* ---------- banner de instalação ---------- */
.install{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;color:#fff;background:linear-gradient(115deg,#0d9488,#0284c7 60%,#7c3aed);box-shadow:var(--shadow)}
.install img{width:46px;height:46px;flex:none;border-radius:12px;border:2px solid rgba(255,255,255,.4)}
.install .t{flex:1;min-width:170px;display:grid;gap:2px}
.install strong{font-family:var(--f-display);font-weight:600;font-size:17px}
.install span{font-size:14px;opacity:.95}
.install .btn{background:#fff;color:#0369a1;box-shadow:none}
.install .x{background:none;border:0;color:#fff;opacity:.8;font-size:26px;line-height:1;padding:4px 8px}
.install .x:hover{opacity:1}
.home-install{margin-bottom:20px}

/* ---------- entrada animada (somente ao trocar de tela) ---------- */
.anim .lock-card,.anim .hero,.anim .list-head,.anim .row,.anim .empty{animation-name:rise;animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.9,.3,1.15);animation-fill-mode:both;animation-delay:calc(var(--i,0) * 60ms)}
.anim .lock-card{animation:rise .7s cubic-bezier(.2,.9,.3,1.15) both,spin 8s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}

/* ---------- celular ---------- */
@media (max-width:600px){
  .wrap{padding-top:10px}
  .top{top:6px;padding:8px 10px;margin-bottom:16px}
  .top h1{font-size:18px}
  .top .sub{max-width:46vw;font-size:13px}
  .top .actions{gap:6px}
  .hero{padding:22px 18px;border-radius:24px}
  .hero p{font-size:16px}
  .row{padding:15px 14px 15px 20px;border-radius:20px}
  .row-top{gap:11px}
  .avatar{width:44px;height:44px;font-size:20px;border-radius:14px}
  .row-actions{gap:4px}
  .row-actions .icon-btn{width:38px;height:38px}
  .sheet{padding:22px 18px 18px;border-radius:24px}
  .lock-card{padding:26px 20px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* Mostra o motivo na tela se o app não carregar (ex.: arquivo aberto direto do computador). */
(function () {
  var errs = [];
  window.addEventListener("error", function (e) { errs.push((e.message || "Erro") + (e.filename ? " (" + e.filename.split("/").pop() + ")" : "")); }, true);
  window.addEventListener("unhandledrejection", function (e) { errs.push(String(e.reason && (e.reason.message || e.reason))); });
  setTimeout(function () {
    var app = document.getElementById("app");
    if (!app || app.textContent.trim() !== "Carregando…") return;
    var msg;
    if (location.protocol === "file:") {
      msg = "O app foi aberto direto do computador (endereço começando com file://). O navegador bloqueia o app assim. Abra pelo endereço do GitHub Pages, por exemplo https://SEU-USUARIO.github.io/cofre-de-acessos/.";
    } else {
      msg = "O app não conseguiu carregar. Verifique a internet e se a configuração do Firebase foi colada corretamente no index.html.";
    }
    app.innerHTML = '<div class="lock"><div class="lock-card"><h1 style="font-size:24px">Cofre de Acessos</h1><p class="msg err" style="margin:0"></p><p class="hint" style="margin:0"></p></div></div>';
    app.querySelector(".msg").textContent = msg;
    app.querySelector(".hint").textContent = errs.length ? "Detalhe técnico: " + errs.join(" | ") : "";
  }, 6000);
})();
</script>

    <div class="brand"><h1 class="grad-text">Crie sua senha</h1><p>Você entrou com a senha inicial. Escolha uma senha pessoal para continuar.</p></div>
    ${passField("s-pass", "Nova senha", "new-password")}
    ${passField("s-pass2", "Repita a nova senha", "new-password")}
    <p class="hint" style="margin-top:-6px">Pelo menos 8 caracteres. Se esquecer, use “Esqueci minha senha” e receba um link por e-mail.</p>
    <div id="setup-msg" class="msg err" hidden></div>
    <button class="btn block" type="submit">Salvar senha e continuar</button>
    <div style="text-align:center"><button type="button" class="link" id="b-out">Sair</button></div>
  </form></div>`;
}
function topBar() {
  return `<header class="top"><div class="who"><img class="mark" src="icon-192.png" alt="">
    <div style="min-width:0"><h1 class="grad-text">Cofre de Acessos</h1><div class="sub">${esc(S.user.email)}</div></div></div>
    <div class="actions"><button class="icon-btn" data-go="${S.view === "settings" ? "home" : "settings"}" aria-label="Configurações" title="Configurações">${icon("gear")}</button><button class="icon-btn" id="b-lock" aria-label="Sair" title="Sair">${icon("lock")}</button></div></header>`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Boa noite" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
}
function viewHome() {
  const K = KINDS.logins; const all = S.data.logins;
  const n = all.length, withPw = all.filter(x => x.senha).length, withObs = all.filter(x => x.obs).length;
  const plural = (v, a, b) => `<b>${v}</b> ${v === 1 ? a : b}`;
  const chips = S.loaded.logins
    ? `<span class="chip">${icon("key")} ${plural(n, "login", "logins")}</span><span class="chip">${icon("shield")} ${plural(withPw, "com senha", "com senha")}</span><span class="chip">${icon("note")} ${plural(withObs, "com observação", "com observações")}</span>`
    : `<span class="chip">Carregando…</span>`;
  return `${topBar()}
  ${installBanner("home-install")}
  <section class="hero" style="--i:0">
    <span class="eyebrow"><span class="wave" aria-hidden="true">👋</span> ${greeting()}!</span>
    <h2>Meus Logins</h2>
    <p>Sites e serviços com endereço, login, senha e observações — tudo guardado com segurança.</p>
    <div class="chips">${chips}</div>
    <div class="hero-actions"><button class="btn light" data-new="logins">${icon("plus")} ${K.add}</button></div>
  </section>
  ${viewList("logins")}`;
}
function viewList(kind) {
  const K = KINDS[kind]; const all = S.data[kind];
  const q = S.query.trim().toLowerCase();
  const items = all.filter(it => !q || K.fields.some(([f, , t]) => t !== "password" && String(it[f] || "").toLowerCase().includes(q)))
    .sort((a, b) => (a.nome || a.url || "").localeCompare(b.nome || b.url || "", "pt-BR", { sensitivity: "base" }));
  const empty = !S.loaded[kind]
    ? `<div class="empty"><p>Carregando…</p></div>`
    : all.length === 0
      ? `<div class="empty"><span class="ic">${icon(K.ic)}</span><h3>Nenhum ${K.one} cadastrado ainda</h3><p>Toque em “${K.add}” para guardar o primeiro. Nenhum campo é obrigatório.</p><button class="btn" data-new="${kind}">${icon("plus")} ${K.add}</button></div>`
      : `<div class="empty"><span class="ic">${icon("search")}</span><h3>Nada encontrado</h3><p>Nenhum ${K.one} corresponde a “${esc(S.query)}”.</p></div>`;
  return `${all.length ? `<div class="list-head" style="--i:1"><div class="input search"><span class="pre">${icon("search")}</span><input id="q" type="search" placeholder="Buscar por nome, URL, login ou observação…" value="${esc(S.query)}" autocomplete="off" aria-label="Buscar"></div><span class="count-pill">${items.length} de ${all.length}</span></div>` : ""}
  <div class="rows">${items.length ? items.map((it, i) => rowHTML(kind, it, i)).join("") : empty}</div>`;
}
function cell(label, value, o = {}) {
  const has = !!String(value || "").length;
  const shown = o.secret && !o.revealed ? "••••••••••" : value;
  return `<div class="cell"><div class="txt"><span class="k">${label}</span><span class="v">${has ? esc(shown) : '<span class="muted">—</span>'}</span></div>
    ${has && o.secret ? `<button class="icon-btn" data-reveal="${o.id}" aria-label="${o.revealed ? "Ocultar" : "Mostrar"} senha">${icon(o.revealed ? "eyeoff" : "eye")}</button>` : ""}
    ${has ? `<button class="icon-btn" data-copy="${o.kind}|${o.id}|${o.field}" aria-label="Copiar ${label}" title="Copiar">${icon("copy")}</button>` : ""}</div>`;
}
function rowHTML(kind, it, i = 0) {
  const K = KINDS[kind]; const title = it.nome || showUrl(it.url) || it.login || "Sem nome";
  const initial = (title.trim()[0] || "?").toUpperCase(); const revealed = S.reveal.has(it.id);
  const cells = K.fields.filter(([f, , t]) => f !== "nome" && f !== "url" && t !== "textarea")
    .map(([f, label, t]) => cell(label, it[f], { kind, id: it.id, field: f, secret: t === "password", revealed })).join("");
  const conf = S.confirmDel === it.id ? `<div class="confirm"><span>Excluir “${esc(title)}”? Esta ação não pode ser desfeita.</span><button class="btn ghost" data-cancel-del>Cancelar</button><button class="btn danger" data-do-del="${kind}|${it.id}">Excluir</button></div>` : "";
  const note = it.obs ? `<div class="note"><div class="txt"><span class="k">${icon("note")} Observações</span><span class="v">${esc(it.obs)}</span></div><button class="icon-btn" data-copy="${kind}|${it.id}|obs" aria-label="Copiar observações" title="Copiar">${icon("copy")}</button></div>` : "";
  return `<article class="row ${colorOf(title)}" style="--i:${Math.min(i + 2, 14)}"><div class="row-top"><span class="avatar" aria-hidden="true">${esc(initial)}</span>
    <div class="row-title"><strong>${esc(title)}</strong>${it.url ? `<a href="${esc(hrefOf(it.url))}" target="_blank" rel="noopener noreferrer">${esc(showUrl(it.url))}</a>` : ""}</div>
    <div class="row-actions"><button class="icon-btn" data-edit="${kind}|${it.id}" aria-label="Editar" title="Editar">${icon("edit")}</button><button class="icon-btn del" data-del="${it.id}" aria-label="Excluir" title="Excluir">${icon("trash")}</button></div></div>
    <div class="kv">${cells}</div>${note}${conf}</article>`;
}
function viewSettings() {
  return `${topBar()}
  <button class="back" data-go="home">${icon("back")} Voltar aos logins</button>
  <div class="list-head" style="--i:0"><h2 class="grad-text">Configurações</h2></div>
  <div class="rows settings">
    <form class="row c0" id="f-chpw" novalidate style="--i:1"><h3>Alterar senha</h3>
      <div class="grid2">${passField("c-old", "Senha atual")}${passField("c-new", "Nova senha", "new-password")}</div>
      ${passField("c-new2", "Repita a nova senha", "new-password")}
      <div id="chpw-msg" class="msg err" hidden></div>
      <div><button class="btn" type="submit">Salvar nova senha</button></div></form>
    <div class="row c2" style="--i:2"><h3>Recuperação de senha</h3>
      <p>Se esquecer a senha, use “Esqueci minha senha” na tela de entrada. O link de redefinição é enviado para ${esc(S.user.email)}.</p></div>
    <div class="row c1" style="--i:3"><h3>Segurança</h3>
      <p>Os cadastros ficam no Firestore do seu projeto Firebase, acessíveis apenas com este login. Você sai automaticamente após ${LOCK_AFTER_MINUTES} minutos sem uso ou ao fechar a aba.</p></div>
  </div>`;
}
function modalHTML() {
  const { kind, item } = S.editing; const K = KINDS[kind];
  const val = f => esc(item ? item[f] || "" : "");
  const inputs = K.fields.map(([f, label, t]) => {
    if (t === "url") return `<div class="field"><label for="e-${f}">${label}</label><div class="input"><span class="pre">https://</span><input id="e-${f}" autocomplete="off" spellcheck="false" inputmode="url" placeholder="exemplo.com.br" value="${esc(showUrl(item ? item[f] : ""))}"></div></div>`;
    if (t === "textarea") return `<div class="field full"><label for="e-${f}">${label}</label><div class="input"><textarea id="e-${f}" rows="4" placeholder="Ex.: perguntas de segurança, PIN, quem usa esta conta, código de recuperação…">${val(f)}</textarea></div></div>`;
    if (t === "password") return `<div class="field"><label for="e-${f}">${label}</label><div class="input"><input id="e-${f}" type="password" class="mono" autocomplete="new-password" value="${val(f)}"><button type="button" class="icon-btn" data-gen="e-${f}" aria-label="Gerar senha forte" title="Gerar senha forte">${icon("dice")}</button><button type="button" class="icon-btn" data-toggle="e-${f}" aria-label="Mostrar senha">${icon("eye")}</button></div></div>`;
    return `<div class="field"><label for="e-${f}">${label}</label><div class="input"><input id="e-${f}" autocomplete="off" value="${val(f)}"></div></div>`;
  }).join("");
  return `<div class="scrim" id="scrim"><form class="sheet" id="f-edit" novalidate role="dialog" aria-modal="true" aria-labelledby="e-title">
    <h3 id="e-title"><span class="ic">${icon(item ? "edit" : "plus")}</span>${item ? "Editar " + K.one : K.add}</h3>
    <div class="grid2">${inputs}</div>
    <p class="hint">Nenhum campo é obrigatório. A URL pode ser digitada sem “http”.</p>
    <div id="edit-msg" class="msg err" hidden></div>
    <div class="sheet-foot"><button type="button" class="btn ghost" id="b-cancel">Cancelar</button><button class="btn" type="submit" id="b-save">Salvar</button></div>
  </form></div>`;
}

function render(keepFocus = false) {
  const active = keepFocus ? document.activeElement : null;
  const activeId = active && active.id; const pos = active && active.selectionStart;
  let html;
  if (!configured) html = viewNotConfigured();
  else if (S.view === "loading") html = viewLoading();
  else if (S.view === "lock") html = viewLock();
  else if (S.view === "recover") html = viewRecover();
  else if (!S.user) html = viewLock();
  else if (S.view === "setup") html = viewSetup();
  else if (S.view === "home") html = viewHome();
  else if (S.view === "settings") html = viewSettings();
  else html = viewHome();
  if (S.editing && S.user) html += modalHTML();
  app.innerHTML = html;
  if (activeId) { const el = document.getElementById(activeId); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
  else if (S.view === "lock") { const p = $("#l-pass"); if (p) p.focus({ preventScroll: true }); }
  if (S.view === "lock" && S.lockNote) { setMsg("#lock-msg", S.lockNote, "ok"); S.lockNote = ""; }
}
let animTimer = null;
function animateIn() { app.classList.add("anim"); clearTimeout(animTimer); animTimer = setTimeout(() => app.classList.remove("anim"), 1400); }
function go(view) {
  if (view === "logins" || view === "apps") view = "home";
  S.view = view; S.query = ""; S.confirmDel = null; S.reveal.clear(); animateIn(); render(); scrollTo(0, 0);
}

/* ---------- actions ---------- */
function pwProblem(a, b) {
  if (a.length < 8) return "A nova senha precisa ter pelo menos 8 caracteres.";
  if (a !== b) return "As duas senhas digitadas não são iguais.";
  if (a === INITIAL_PASSWORD) return "Escolha uma senha diferente da senha inicial.";
  return "";
}
async function doLogin() {
  const email = normEmail($("#l-email").value), pass = $("#l-pass").value;
  S.lastEmail = email;
  if (email !== normEmail(ALLOWED_EMAIL)) return setMsg("#lock-msg", "E-mail ou senha incorretos.");
  const btn = $("#b-login"); btn.disabled = true; btn.textContent = "Entrando…"; setMsg("#lock-msg", "");
  try {
    if (pass === INITIAL_PASSWORD) ss.set(MUST_CHANGE_KEY, "1"); else ss.del(MUST_CHANGE_KEY);
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) { ss.del(MUST_CHANGE_KEY); setMsg("#lock-msg", authMessage(e)); }
  finally { const b = $("#b-login"); if (b) { b.disabled = false; b.textContent = "Entrar"; } }
}
async function doRecover() {
  const email = normEmail($("#r-email").value);
  if (!/^\S+@\S+\.\S+$/.test(email)) return setMsg("#rec-msg", "Digite um e-mail válido.");
  S.lastEmail = email;
  const btn = $("#f-recover button[type=submit]"); btn.disabled = true; btn.textContent = "Enviando…";
  try {
    if (email === normEmail(ALLOWED_EMAIL)) {
      await sendPasswordResetEmail(auth, email, { url: location.origin + location.pathname });
    }
    setMsg("#rec-msg", `Se ${email} estiver cadastrado, você receberá em instantes um e-mail com o link para criar uma nova senha.`, "ok");
  } catch (e) { setMsg("#rec-msg", authMessage(e)); }
  finally { btn.disabled = false; btn.textContent = "Enviar link de recuperação"; }
}
async function doSetup() {
  const a = $("#s-pass").value, b = $("#s-pass2").value;
  const p = pwProblem(a, b); if (p) return setMsg("#setup-msg", p);
  const btn = $("#f-setup button[type=submit]"); btn.disabled = true; btn.textContent = "Salvando…";
  try { await updatePassword(auth.currentUser, a); ss.del(MUST_CHANGE_KEY); toast("Senha criada"); go("home"); }
  catch (e) { setMsg("#setup-msg", authMessage(e)); btn.disabled = false; btn.textContent = "Salvar senha e continuar"; }
}
async function doChangePw() {
  const old = $("#c-old").value, a = $("#c-new").value, b = $("#c-new2").value;
  const p = pwProblem(a, b); if (p) return setMsg("#chpw-msg", p);
  if (a === old) return setMsg("#chpw-msg", "A nova senha é igual à atual.");
  const btn = $("#f-chpw button[type=submit]"); btn.disabled = true;
  try {
    await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, old));
    await updatePassword(auth.currentUser, a);
    ["#c-old", "#c-new", "#c-new2"].forEach(s => $(s).value = "");
    setMsg("#chpw-msg", "Senha alterada.", "ok");
  } catch (e) {
    setMsg("#chpw-msg", ["auth/invalid-credential", "auth/wrong-password", "auth/invalid-login-credentials"].includes(e.code) ? "A senha atual está incorreta." : authMessage(e));
  } finally { btn.disabled = false; }
}
async function saveEdit() {
  const { kind, item } = S.editing; const K = KINDS[kind]; const rec = {};
  K.fields.forEach(([f, , t]) => {
    let v = $("#e-" + f).value;
    if (t === "url") v = v.trim().replace(/^https?:\/\//i, ""); else if (t !== "password") v = v.trim();
    rec[f] = v;
  });
  if (!K.fields.some(([f]) => rec[f])) return setMsg("#edit-msg", "Preencha ao menos um campo para salvar.");
  const btn = $("#b-save"); btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const col = collection(db, "users", S.user.uid, kind);
    if (item) await updateDoc(doc(col, item.id), { ...rec, atualizado: serverTimestamp() });
    else await addDoc(col, { ...rec, criado: serverTimestamp(), atualizado: serverTimestamp() });
    S.editing = null; render(); toast(item ? "Alterações salvas" : K.done);
    if (!item) confetti(innerWidth / 2, innerHeight * 0.4);
  } catch (e) {
    console.error(e);
    setMsg("#edit-msg", e.code === "permission-denied" ? "Sem permissão para gravar. Confira as regras do Firestore." : "Não foi possível salvar. Verifique a conexão e tente de novo.");
    btn.disabled = false; btn.textContent = "Salvar";
  }
}
async function doDelete(kind, id) {
  try { await deleteDoc(doc(db, "users", S.user.uid, kind, id)); S.confirmDel = null; S.reveal.delete(id); toast("Excluído"); }
  catch { toast("Não foi possível excluir. Tente de novo."); }
}

/* ---------- events ---------- */
app.addEventListener("submit", e => {
  e.preventDefault();
  ({ "f-login": doLogin, "f-recover": doRecover, "f-setup": doSetup, "f-chpw": doChangePw, "f-edit": saveEdit })[e.target.id]?.();
});
app.addEventListener("input", e => {
  if (e.target.id === "l-pass") spinDial(e.target.value.length);
  if (e.target.id === "e-url" && /^https?:\/\//i.test(e.target.value)) e.target.value = e.target.value.replace(/^https?:\/\//i, "");
  if (e.target.id === "q") { S.query = e.target.value; render(true); }
});
app.addEventListener("pointerdown", ripple);
app.addEventListener("click", e => {
  const t = e.target.closest("button, .scrim"); if (!t) return;
  const d = t.dataset;
  if (t.id === "scrim" && e.target === t) { S.editing = null; render(); return; }
  if (d.toggle) { const inp = $("#" + d.toggle); const show = inp.type === "password"; inp.type = show ? "text" : "password"; t.innerHTML = icon(show ? "eyeoff" : "eye"); t.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha"); return; }
  if (d.gen) { const inp = $("#" + d.gen); inp.value = genPassword(); inp.type = "text"; const tg = inp.parentElement.querySelector("[data-toggle]"); if (tg) tg.innerHTML = icon("eyeoff"); toast("Senha forte gerada"); return; }
  if (d.go) { go(d.go); return; }
  if (t.id === "b-lock" || t.id === "b-out") { S.lockNote = "Você saiu do cofre."; signOut(auth); return; }
  if (d.new) { S.editing = { kind: d.new, item: null }; render(); $("#f-edit input")?.focus(); return; }
  if (d.edit) { const [k, id] = d.edit.split("|"); S.editing = { kind: k, item: S.data[k].find(x => x.id === id) }; render(); $("#f-edit input")?.focus(); return; }
  if (t.id === "b-cancel") { S.editing = null; render(); return; }
  if (d.del) { S.confirmDel = d.del; render(); return; }
  if ("cancelDel" in d) { S.confirmDel = null; render(); return; }
  if (d.doDel) { const [k, id] = d.doDel.split("|"); doDelete(k, id); return; }
  if (d.reveal) { S.reveal.has(d.reveal) ? S.reveal.delete(d.reveal) : S.reveal.add(d.reveal); render(); return; }
  if (d.copy) {
    const [k, id, f] = d.copy.split("|"); const it = S.data[k].find(x => x.id === id);
    const labels = { login: "Login", senha: "Senha", obs: "Observações" };
    const box = t.closest(".cell, .note"); if (box && it && it[f]) { box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash"); }
    copy(it && it[f], labels[f] || "Valor"); return;
  }
});
addEventListener("keydown", e => { if (e.key === "Escape" && S.editing) { S.editing = null; render(); } });

/* ---------- install (PWA) ---------- */
let deferredPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const INSTALL_KEY = "cofre-install-dismissed";
const installDismissed = () => { try { return localStorage.getItem(INSTALL_KEY) === "1"; } catch { return false; } };
function installBanner(extra = "") {
  if (isStandalone() || installDismissed()) return "";
  if (deferredPrompt) return `<div class="install ${extra}"><img src="icon-192.png" alt=""><div class="t"><strong>Instale o Cofre</strong><span>Abra direto da tela inicial, como um aplicativo.</span></div><button type="button" class="btn" data-install>Instalar</button><button type="button" class="x" data-install-x aria-label="Agora não">×</button></div>`;
  if (isIOS) return `<div class="install ${extra}"><img src="icon-192.png" alt=""><div class="t"><strong>Instale o Cofre no iPhone</strong><span>No Safari, toque em Compartilhar (quadrado com seta) e depois em “Adicionar à Tela de Início”.</span></div><button type="button" class="x" data-install-x aria-label="Fechar">×</button></div>`;
  return "";
}
const canRepaint = () => !S.editing && ["lock", "home"].includes(S.view) && !(document.activeElement && document.activeElement.type === "password" && document.activeElement.value);
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (canRepaint()) render(true); });
addEventListener("appinstalled", () => { deferredPrompt = null; toast("Aplicativo instalado"); if (canRepaint()) render(true); });
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-install],[data-install-x]"); if (!b) return;
  if ("installX" in b.dataset) { try { localStorage.setItem(INSTALL_KEY, "1"); } catch {} render(true); return; }
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch {}
  deferredPrompt = null; render(true);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- boot ---------- */
if (!configured) render();
else {
  onAuthStateChanged(auth, user => {
    if (user && normEmail(user.email) !== normEmail(ALLOWED_EMAIL)) { signOut(auth); return; }
    S.user = user || null;
    S.editing = null;
    if (user) {
      subscribe(user.uid); bumpIdle();
      S.view = ss.get(MUST_CHANGE_KEY) ? "setup" : "home";
    } else {
      unsubscribe(); clearTimeout(idleTimer);
      if (S.view !== "recover") S.view = "lock";
    }
    animateIn(); render();
  });
}
</script>
</body>
</html>
