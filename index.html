<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5654df">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column (max 880px); black-and-white striped identity, vault dial on the lock screen, card grid at home. */
:root{
  --bg:#f3f3f3; --surface:#ffffff; --surface-2:#efefef; --line:#d4d4d4;
  --fg:#0a0a0a; --muted:#5a5a5a; --accent:#0a0a0a; --accent-fg:#ffffff;
  --brass:#d0021b; --red:#d0021b; --danger:#c62828; --ok:#1b7f3b; --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.08);
  --stripe-a:#0a0a0a; --stripe-b:#ffffff;
  --f-display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050505; --surface:#121212; --surface-2:#1c1c1c; --line:#2f2f2f;
  --fg:#f5f5f5; --muted:#a6a6a6; --accent:#ffffff; --accent-fg:#000000;
  --brass:#ff4d5a; --red:#ff4d5a; --danger:#ff8a80; --ok:#81c995; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
  --stripe-a:#ffffff; --stripe-b:#050505;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050505; --surface:#121212; --surface-2:#1c1c1c; --line:#2f2f2f;
  --fg:#f5f5f5; --muted:#a6a6a6; --accent:#ffffff; --accent-fg:#000000;
  --brass:#ff4d5a; --red:#ff4d5a; --danger:#ff8a80; --ok:#81c995; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
  --stripe-a:#ffffff; --stripe-b:#050505;
  color-scheme:dark}
*{box-sizing:border-box}
.stripes{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--stripe-a) 0 12px,var(--stripe-b) 12px 24px);border:1px solid var(--stripe-a)}
.lock-card{position:relative;overflow:hidden}
.lock-card .stripes{position:absolute;left:0;right:0;top:0;border-radius:0;border-width:0 0 1px}
.top{position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:repeating-linear-gradient(90deg,var(--stripe-a) 0 10px,transparent 10px 20px)}
.tile{overflow:hidden}
.tile::before{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,var(--stripe-a) 0 10px,var(--stripe-b) 10px 20px);opacity:.9}
.install{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--accent);color:var(--accent-fg)}
.install img{width:44px;height:44px;border-radius:10px;flex:none;border:1px solid color-mix(in srgb,var(--accent-fg) 25%,transparent)}
.install .t{flex:1;min-width:160px;display:grid;gap:2px}
.install strong{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1}
.install span{font-size:13px;opacity:.85}
.install .btn{background:var(--accent-fg);color:var(--accent)}
.install .x{background:none;border:0;color:var(--accent-fg);opacity:.7;font-size:22px;line-height:1;padding:4px 8px}
.install .x:hover{opacity:1}
.home-install{margin-bottom:20px}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.03em;line-height:1.05;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.icon-btn:hover{color:var(--fg);background:var(--surface-2)}
.icon-btn svg{width:17px;height:17px}
.btn svg,.back svg,.tile .arrow svg,.empty .ic svg{width:18px;height:18px;flex:none}
.empty .ic svg{width:28px;height:28px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.input input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);padding:11px 12px;outline:none}
.input .pre{padding-left:12px;color:var(--muted);font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.input .pre + input{padding-left:2px}
.input .icon-btn{border:0;background:transparent;margin-right:4px}
.mono{font-family:var(--f-mono)}
.msg{font-size:14px;border-radius:8px;padding:9px 12px}
.msg.err{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.msg.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* lock screen */
.lock{min-height:calc(100vh - 48px);display:grid;place-items:center}
.lock-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:18px}
.dial-wrap{display:grid;place-items:center;margin-top:-4px}
.dial{width:120px;height:120px}
.dial .ring{transition:transform .35s cubic-bezier(.3,1.4,.5,1);transform-origin:60px 60px}
.brand{text-align:center;display:grid;gap:4px}
.brand h1{font-size:40px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.store-note{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.local{background:var(--brass)}
.code-box{font-family:var(--f-mono);font-size:20px;letter-spacing:.08em;text-align:center;padding:14px;border:1px dashed var(--brass);border-radius:10px;color:var(--fg);background:color-mix(in srgb,var(--brass) 8%,transparent);user-select:all;word-break:break-all}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;accent-color:var(--accent)}

/* app shell */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.top .who{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;flex:none}
.top h1{font-size:26px}
.top .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .actions{display:flex;gap:8px}
.greet{margin-bottom:20px}
.greet h2{font-size:clamp(36px,7vw,52px)}
.greet p{margin:6px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;color:var(--fg);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.tile .ic svg{width:24px;height:24px}
.tile h3{font-size:32px}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile .count{font-family:var(--f-mono);font-size:13px;color:var(--brass);letter-spacing:.04em}
.tile .arrow{position:absolute;right:20px;top:22px;color:var(--muted)}
.recent{margin-top:28px}
.recent h3{font-size:13px;font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* list */
.list-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.list-head h2{font-size:40px;flex:1;min-width:180px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);padding:0;margin-bottom:12px;font-weight:500}
.back:hover{color:var(--fg)}
.search{flex:1 1 240px}
.rows{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.row-top{display:flex;align-items:flex-start;gap:12px}
.avatar{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row-title{flex:1;min-width:0}
.row-title strong{display:block;font-size:16px;overflow-wrap:anywhere}
.row-title a{font-family:var(--f-mono);font-size:13px;color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.row-title a:hover{text-decoration:underline}
.row-actions{display:flex;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.kv .cell{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.kv .cell .k{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv .cell .v{font-family:var(--f-mono);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .cell .txt{flex:1;min-width:0;display:grid}
.kv .cell .icon-btn{width:30px;height:30px;flex:none;background:transparent;border:0}
.empty{border:1px dashed var(--line);border-radius:16px;padding:36px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:28px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--danger) 9%,transparent)}
.confirm span{flex:1;min-width:160px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,16,.45);display:grid;place-items:end center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{place-items:center}}
.sheet{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:grid;gap:14px}
.sheet h3{font-size:32px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.hint{font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:40;box-shadow:var(--shadow)}
.saving{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* red details */
.top{border-bottom:2px solid var(--red)}
.lock-card .stripes{border-bottom:3px solid var(--red)}
.tile:hover{border-color:var(--red)}
.tile .ic{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.btn:not(.ghost):not(.danger){box-shadow:inset 0 -3px 0 var(--red)}
.install{border-left:6px solid var(--red)}
.avatar{box-shadow:inset 0 -3px 0 var(--red)}
.link{color:var(--fg);text-decoration-color:var(--red);text-decoration-thickness:2px}
.row-title a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
:focus-visible{outline-color:var(--red)}

/* COFRE APPS — renovação visual aplicada ao CSS realmente utilizado pelo aplicativo */
:root{
 --bg:#f1f5ff;--surface:#ffffff;--surface-2:#f4f2ff;--line:#dce3f5;
 --fg:#20284a;--muted:#65708e;--accent:#5654df;--accent-fg:#ffffff;
 --brass:#f39a3d;--red:#f06477;--danger:#d93f63;--ok:#149c83;
 --shadow:0 8px 24px rgba(58,67,145,.10),0 2px 5px rgba(58,67,145,.05);
 --stripe-a:#5b5be7;--stripe-b:#ffb454;
 --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
 --f-body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
 --r:16px;
 color-scheme:light;
}
:root[data-theme="dark"]{--bg:#11182d;--surface:#1b2540;--surface-2:#252f50;--line:#384568;--fg:#f5f6ff;--muted:#b6c0de;--accent:#a5a4ff;--accent-fg:#171a35;--brass:#ffc16e;--red:#ff8294;--danger:#ff7898;--ok:#57dfbd;--stripe-a:#a5a4ff;--stripe-b:#ffc16e;--shadow:0 8px 24px rgba(0,0,0,.24);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11182d;--surface:#1b2540;--surface-2:#252f50;--line:#384568;--fg:#f5f6ff;--muted:#b6c0de;--accent:#a5a4ff;--accent-fg:#171a35;--brass:#ffc16e;--red:#ff8294;--danger:#ff7898;--ok:#57dfbd;--stripe-a:#a5a4ff;--stripe-b:#ffc16e;--shadow:0 8px 24px rgba(0,0,0,.24)}}
html{width:100%;min-height:100%;overflow-x:hidden;overscroll-behavior-y:none;scroll-behavior:smooth}
body{width:100%;min-height:100dvh;margin:0;overflow-x:hidden;overscroll-behavior-y:none;background:var(--bg);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{width:min(100%,1060px);max-width:1060px;margin-inline:auto;padding:20px clamp(14px,3vw,30px) calc(48px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:750;letter-spacing:-.035em;line-height:1.15}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 12px 16px;margin:0 -4px 24px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);border-radius:0 0 16px 16px}
.top::after{height:3px;bottom:-1px;border-radius:3px;background:linear-gradient(90deg,#625ce7 0 33%,#ffb454 33% 66%,#22b99d 66% 100%)}
.top h1{font-size:22px;letter-spacing:-.04em}.top .mark{width:44px;height:44px;border-radius:14px!important;box-shadow:0 4px 12px rgba(86,84,223,.18)}
.greet{margin:8px 0 22px}.greet h2{font-size:clamp(27px,5vw,38px);letter-spacing:-.045em}.greet p{font-size:16px;line-height:1.5}
.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.tile{border:1px solid var(--line);border-top:5px solid #625ce7;border-radius:22px;padding:24px;gap:16px;box-shadow:var(--shadow);background:var(--surface);transform:none!important;transition:box-shadow .18s,border-color .18s}
.tile:nth-child(2n){border-top-color:#ffad52}.tile:nth-child(3n){border-top-color:#20b99c}
.tile::before{display:none}.tile:hover{box-shadow:0 12px 30px rgba(58,67,145,.16);border-color:var(--accent)}
.tile .ic{width:54px;height:54px;border-radius:17px;background:#eeedff;color:#5654df}.tile:nth-child(2n) .ic{background:#fff0dc;color:#d67a16}.tile:nth-child(3n) .ic{background:#def8f0;color:#0c9279}
.tile .ic svg{width:27px;height:27px}.tile h3{font-size:23px}.tile p{font-size:15px;line-height:1.55}.tile .count{display:inline-flex;width:fit-content;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--accent);font-family:var(--f-body);font-weight:800;font-size:13px;letter-spacing:0}
.row{border-radius:17px;border:1px solid var(--line);border-left:4px solid #625ce7;padding:16px;box-shadow:0 3px 12px rgba(58,67,145,.045);gap:12px}.row:nth-child(3n+2){border-left-color:#ffad52}.row:nth-child(3n){border-left-color:#20b99c}
.avatar{width:42px;height:42px;border-radius:14px;background:#eeedff;color:#5654df}.row-title strong{font-size:17px}.kv .cell{border-radius:11px;background:var(--surface-2)}
.btn{min-height:42px;border-radius:12px;padding:10px 16px;font-weight:800;box-shadow:0 3px 8px rgba(44,54,125,.09);transition:filter .15s,box-shadow .15s}
.btn:active{transform:none}.btn.ghost{box-shadow:none}.icon-btn{width:38px;height:38px;border-radius:12px}
.input{border-radius:13px;border-color:var(--line)}.input input{padding:13px 12px}.field label{font-size:12px;letter-spacing:.045em}
.lock{min-height:calc(100dvh - 40px);padding:12px 0}.lock-card{max-width:430px;border:1px solid var(--line);border-radius:26px;padding:32px 26px;gap:20px;box-shadow:0 18px 48px rgba(58,67,145,.13)}
.lock-card .stripes{height:6px;background:linear-gradient(90deg,#625ce7 0 33%,#ffb454 33% 66%,#20b99c 66% 100%)}.brand h1{font-size:32px;letter-spacing:-.04em}.brand p{font-size:15px}
.scrim{position:fixed;inset:0;z-index:30;overflow-y:auto;overscroll-behavior:contain;align-items:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(24,31,66,.48)}
.sheet{max-height:min(88dvh,850px);overscroll-behavior:contain;border-radius:24px;padding:24px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(17,24,55,.28)}
.toast{z-index:50;max-width:calc(100vw - 28px);white-space:normal;text-align:center;background:var(--fg);color:var(--bg)}
.install{border-radius:18px;background:linear-gradient(115deg,#5654df,#7973f2);box-shadow:var(--shadow)}
button,a,.tile,.row{-webkit-tap-highlight-color:transparent}
@media(max-width:600px){.wrap{padding-top:12px}.top{padding:10px 4px 14px;margin-bottom:20px}.top h1{font-size:19px}.top .sub{max-width:48vw}.top .actions{gap:5px}.tiles{grid-template-columns:1fr;gap:13px}.tile{padding:20px;border-radius:19px}.tile h3{font-size:22px}.list-head h2{font-size:26px}.row{padding:13px}.row-top{gap:9px}.row-actions{gap:4px}.sheet{padding:19px;border-radius:21px}.scrim{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}

</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script>
/* Mostra o motivo na tela se o app não carregar (ex.: arquivo aberto direto do computador). */
(function () {
  var errs = [];
  window.addEventListener("error", function (e) { errs.push((e.message || "Erro") + (e.filename ? " (" + e.filename.split("/").pop() + ")" : "")); }, true);
  window.addEventListener("unhandledrejection", function (e) { errs.push(String(e.reason && (e.reason.message || e.reason))); });
  setTimeout(function () {
    var app = document.getElementById("app");
    if (!app || app.textContent.trim() !== "Carregando…") return;
    var msg;
    if (location.protocol === "file:") {
      msg = "O app foi aberto direto do computador (endereço começando com file://). O navegador bloqueia o app assim. Abra pelo endereço do GitHub Pages, por exemplo https://SEU-USUARIO.github.io/cofre-de-acessos/.";
    } else {
      msg = "O app não conseguiu carregar. Verifique a internet e se a configuração do Firebase foi colada corretamente no index.html.";
    }
    app.innerHTML = '<div class="lock"><div class="lock-card"><h1 style="font-size:24px">Cofre de Acessos</h1><p class="msg err" style="margin:0"></p><p class="hint" style="margin:0"></p></div></div>';
    app.querySelector(".msg").textContent = msg;
    app.querySelector(".hint").textContent = errs.length ? "Detalhe técnico: " + errs.join(" | ") : "";
  }, 6000);
})();
</script>

function toast(text) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}
async function copy(text, label) {
  if (!text) { toast("Campo vazio"); return; }
  try { await navigator.clipboard.writeText(text); toast(label + " copiado"); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(label + " copiado"); } catch { toast("Selecione e copie manualmente"); }
    ta.remove();
  }
}
function genPassword(len = 16) {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?-_";
  const r = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(r, x => chars[x % chars.length]).join("");
}
function authMessage(err) {
  const c = err && err.code || "";
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email", "auth/invalid-login-credentials"].includes(c)) return "E-mail ou senha incorretos.";
  if (c === "auth/too-many-requests") return "Muitas tentativas seguidas. Aguarde alguns minutos ou use “Esqueci minha senha”.";
  if (c === "auth/network-request-failed") return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
  if (c === "auth/weak-password") return "Senha fraca. Use pelo menos 8 caracteres.";
  if (c === "auth/requires-recent-login") return "Por segurança, saia e entre de novo antes de trocar a senha.";
  if (c === "auth/user-disabled") return "Este usuário está desativado no Firebase.";
  if (c === "auth/unauthorized-domain" || c === "auth/unauthorized-continue-uri") return "Este endereço não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).";
  return "Não foi possível concluir. Tente de novo.";
}

/* ---------- firebase ---------- */
const configured = firebaseConfig && firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("COLE");
let auth, db;
if (configured) {
  const fb = initializeApp(firebaseConfig);
  auth = getAuth(fb);

  db = getFirestore(fb);
  setPersistence(auth, browserSessionPersistence).catch(() => {});
}

/* ---------- state ---------- */
const S = {
  user: null, view: "loading", query: "", editing: null, confirmDel: null,
  reveal: new Set(), data: { logins: [], apps: [] }, loaded: { logins: false, apps: false }, unsubs: []
};

const KINDS = {
  logins: { title: "Meus Logins", one: "login", add: "Novo login", ic: "key", done: "Login cadastrado",
    fields: [["nome", "Nome", "text"], ["url", "URL", "url"], ["login", "Login", "text"], ["senha", "Senha", "password"]] },
  apps: { title: "Meus Aplicativos", one: "aplicativo", add: "Novo aplicativo", ic: "apps", done: "Aplicativo cadastrado",
    fields: [["nome", "Nome", "text"], ["url", "URL", "url"], ["hospedagem", "Hospedagem", "text"], ["banco", "Base de dados", "text"], ["login", "Login", "text"], ["senha", "Senha", "password"]] }

/* ---------- auto sign-out ---------- */
let idleTimer = null;
function bumpIdle() {
  if (!S.user) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { S.lockNote = "Você saiu automaticamente por inatividade."; signOut(auth); }, LOCK_AFTER_MINUTES * 60 * 1000);
}
["pointerdown", "keydown", "scroll"].forEach(ev => addEventListener(ev, bumpIdle, { passive: true }));

/* ---------- data subscriptions ---------- */
function subscribe(uid) {
  unsubscribe();
  for (const kind of ["logins", "apps"]) {
    const ref = collection(db, "users", uid, kind);
    S.unsubs.push(onSnapshot(ref, snap => {
      S.data[kind] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded[kind] = true;
      if (!S.editing && ["home", "logins", "apps"].includes(S.view)) render(true);
    }, err => {
      console.error(err);
      toast(err.code === "permission-denied" ? "Sem permissão no banco de dados. Confira as regras do Firestore." : "Erro ao carregar os dados.");
    }));
  }
}
function unsubscribe() { S.unsubs.forEach(u => u()); S.unsubs = []; S.data = { logins: [], apps: [] }; S.loaded = { logins: false, apps: false }; }

/* ---------- views ---------- */
function setMsg(sel, text, kind = "err") { const el = $(sel); if (!el) return; el.hidden = !text; el.className = "msg " + kind; el.textContent = text || ""; }

  </g>

</svg>`;

function viewList(kind) {
  const K = KINDS[kind]; const all = S.data[kind];

      ? `<div class="empty"><span class="ic" style="color:var(--accent)">${icon(K.ic)}</span><h3>Nenhum ${K.one} cadastrado</h3><p style="margin:0">Toque em “${K.add}” para guardar o primeiro. Nenhum campo é obrigatório.</p><button class="btn" data-new="${kind}">${icon("plus")} ${K.add}</button></div>`

}
function cell(label, value, o = {}) {
  const has = !!String(value || "").length;
  const shown = o.secret && !o.revealed ? "••••••••••" : value;
  return `<div class="cell"><div class="txt"><span class="k">${label}</span><span class="v">${has ? esc(shown) : '<span class="muted">—</span>'}</span></div>

    ${has ? `<button class="icon-btn" data-copy="${o.kind}|${o.id}|${o.field}" aria-label="Copiar ${label}">${icon("copy")}</button>` : ""}</div>`;
}
function rowHTML(kind, it) {
  const K = KINDS[kind]; const title = it.nome || showUrl(it.url) || it.login || "Sem nome";
  const initial = (title.trim()[0] || "?").toUpperCase(); const revealed = S.reveal.has(it.id);
  const cells = K.fields.filter(([f]) => f !== "nome" && f !== "url")
    .map(([f, label, t]) => cell(label, it[f], { kind, id: it.id, field: f, secret: t === "password", revealed })).join("");
  const conf = S.confirmDel === it.id ? `<div class="confirm"><span>Excluir “${esc(title)}”? Esta ação não pode ser desfeita.</span><button class="btn ghost" data-cancel-del>Cancelar</button><button class="btn danger" data-do-del="${kind}|${it.id}">Excluir</button></div>` : "";
  return `<article class="row"><div class="row-top"><span class="avatar">${esc(initial)}</span>
    <div class="row-title"><strong>${esc(title)}</strong>${it.url ? `<a href="${esc(hrefOf(it.url))}" target="_blank" rel="noopener noreferrer">${esc(showUrl(it.url))}</a>` : ""}</div>

    <div class="kv">${cells}</div>${conf}</article>`;
}
function viewSettings() {
  return `${topBar()}
  <button class="back" data-go="home">${icon("back")} Início</button>
  <div class="list-head"><h2>Configurações</h2></div>
  <div class="rows">
    <form class="row" id="f-chpw" novalidate><h3 style="font-size:26px">Alterar senha</h3>
      <div class="grid2">${passField("c-old", "Senha atual")}${passField("c-new", "Nova senha", "new-password")}</div>
      ${passField("c-new2", "Repita a nova senha", "new-password")}
      <div id="chpw-msg" class="msg err" hidden></div>
      <div><button class="btn" type="submit">Salvar nova senha</button></div></form>
    <div class="row"><h3 style="font-size:26px">Recuperação de senha</h3>
      <p class="muted small" style="margin:0">Se esquecer a senha, use “Esqueci minha senha” na tela de entrada. O link de redefinição é enviado para ${esc(S.user.email)}.</p></div>
    <div class="row"><h3 style="font-size:26px">Segurança</h3>
      <p class="muted small" style="margin:0">Os cadastros ficam no Firestore do seu projeto Firebase, acessíveis apenas com este login. Você sai automaticamente após ${LOCK_AFTER_MINUTES} minutos sem uso ou ao fechar a aba.</p></div>
  </div>`;
}
function modalHTML() {
  const { kind, item } = S.editing; const K = KINDS[kind];
  const val = f => esc(item ? item[f] || "" : "");
  const inputs = K.fields.map(([f, label, t]) => {
    if (t === "url") return `<div class="field"><label for="e-${f}">${label}</label><div class="input"><span class="pre">https://</span><input id="e-${f}" autocomplete="off" spellcheck="false" inputmode="url" placeholder="exemplo.com.br" value="${esc(showUrl(item ? item[f] : ""))}"></div></div>`;
    if (t === "password") return `<div class="field"><label for="e-${f}">${label}</label><div class="input"><input id="e-${f}" type="password" class="mono" autocomplete="new-password" value="${val(f)}"><button type="button" class="icon-btn" data-gen="e-${f}" aria-label="Gerar senha forte" title="Gerar senha forte">${icon("dice")}</button><button type="button" class="icon-btn" data-toggle="e-${f}" aria-label="Mostrar senha">${icon("eye")}</button></div></div>`;
    return `<div class="field"><label for="e-${f}">${label}</label><div class="input"><input id="e-${f}" autocomplete="off" value="${val(f)}"></div></div>`;
  }).join("");
  return `<div class="scrim" id="scrim"><form class="sheet" id="f-edit" novalidate role="dialog" aria-modal="true" aria-labelledby="e-title">
    <h3 id="e-title">${item ? "Editar " + K.one : K.add}</h3>
    <div class="grid2">${inputs}</div>
    <p class="hint" style="margin:0">Nenhum campo é obrigatório. A URL pode ser digitada sem “http”.</p>
    <div id="edit-msg" class="msg err" hidden></div>
    <div class="sheet-foot"><button type="button" class="btn ghost" id="b-cancel">Cancelar</button><button class="btn" type="submit" id="b-save">Salvar</button></div>
  </form></div>`;
}

function render(keepFocus = false) {
  const active = keepFocus ? document.activeElement : null;
  const activeId = active && active.id; const pos = active && active.selectionStart;
  let html;
  if (!configured) html = viewNotConfigured();
  else if (S.view === "loading") html = viewLoading();
  else if (S.view === "lock") html = viewLock();
  else if (S.view === "recover") html = viewRecover();
  else if (!S.user) html = viewLock();
  else if (S.view === "setup") html = viewSetup();
  else if (S.view === "home") html = viewHome();
  else if (S.view === "logins" || S.view === "apps") html = viewList(S.view);
  else if (S.view === "settings") html = viewSettings();
  else html = viewHome();
  if (S.editing && S.user) html += modalHTML();
  app.innerHTML = html;
  if (activeId) { const el = document.getElementById(activeId); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
  else if (S.view === "lock") { const p = $("#l-pass"); if (p) p.focus({ preventScroll: true }); }
  if (S.view === "lock" && S.lockNote) { setMsg("#lock-msg", S.lockNote, "ok"); S.lockNote = ""; }
}
function go(view) { S.view = view; S.query = ""; S.confirmDel = null; S.reveal.clear(); render(); scrollTo(0, 0); }

/* ---------- actions ---------- */
function pwProblem(a, b) {
  if (a.length < 8) return "A nova senha precisa ter pelo menos 8 caracteres.";
  if (a !== b) return "As duas senhas digitadas não são iguais.";
  if (a === INITIAL_PASSWORD) return "Escolha uma senha diferente da senha inicial.";
  return "";
}
async function doLogin() {
  const email = normEmail($("#l-email").value), pass = $("#l-pass").value;
  S.lastEmail = email;
  if (email !== normEmail(ALLOWED_EMAIL)) return setMsg("#lock-msg", "E-mail ou senha incorretos.");
  const btn = $("#b-login"); btn.disabled = true; btn.textContent = "Entrando…"; setMsg("#lock-msg", "");
  try {
    if (pass === INITIAL_PASSWORD) ss.set(MUST_CHANGE_KEY, "1"); else ss.del(MUST_CHANGE_KEY);
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) { ss.del(MUST_CHANGE_KEY); setMsg("#lock-msg", authMessage(e)); }
  finally { const b = $("#b-login"); if (b) { b.disabled = false; b.textContent = "Entrar"; } }
}
async function doRecover() {
  const email = normEmail($("#r-email").value);
  if (!/^\S+@\S+\.\S+$/.test(email)) return setMsg("#rec-msg", "Digite um e-mail válido.");
  S.lastEmail = email;
  const btn = $("#f-recover button[type=submit]"); btn.disabled = true; btn.textContent = "Enviando…";
  try {
    if (email === normEmail(ALLOWED_EMAIL)) {
      await sendPasswordResetEmail(auth, email, { url: location.origin + location.pathname });
    }
    setMsg("#rec-msg", `Se ${email} estiver cadastrado, você receberá em instantes um e-mail com o link para criar uma nova senha.`, "ok");
  } catch (e) { setMsg("#rec-msg", authMessage(e)); }
  finally { btn.disabled = false; btn.textContent = "Enviar link de recuperação"; }
}
async function doSetup() {
  const a = $("#s-pass").value, b = $("#s-pass2").value;
  const p = pwProblem(a, b); if (p) return setMsg("#setup-msg", p);
  const btn = $("#f-setup button[type=submit]"); btn.disabled = true; btn.textContent = "Salvando…";
  try { await updatePassword(auth.currentUser, a); ss.del(MUST_CHANGE_KEY); toast("Senha criada"); go("home"); }
  catch (e) { setMsg("#setup-msg", authMessage(e)); btn.disabled = false; btn.textContent = "Salvar senha e continuar"; }
}
async function doChangePw() {
  const old = $("#c-old").value, a = $("#c-new").value, b = $("#c-new2").value;
  const p = pwProblem(a, b); if (p) return setMsg("#chpw-msg", p);
  if (a === old) return setMsg("#chpw-msg", "A nova senha é igual à atual.");
  const btn = $("#f-chpw button[type=submit]"); btn.disabled = true;
  try {
    await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, old));
    await updatePassword(auth.currentUser, a);
    ["#c-old", "#c-new", "#c-new2"].forEach(s => $(s).value = "");
    setMsg("#chpw-msg", "Senha alterada.", "ok");
  } catch (e) {
    setMsg("#chpw-msg", ["auth/invalid-credential", "auth/wrong-password", "auth/invalid-login-credentials"].includes(e.code) ? "A senha atual está incorreta." : authMessage(e));
  } finally { btn.disabled = false; }
}
async function saveEdit() {
  const { kind, item } = S.editing; const K = KINDS[kind]; const rec = {};
  K.fields.forEach(([f, , t]) => {
    let v = $("#e-" + f).value;
    if (t === "url") v = v.trim().replace(/^https?:\/\//i, ""); else if (t !== "password") v = v.trim();
    rec[f] = v;
  });
  if (!K.fields.some(([f]) => rec[f])) return setMsg("#edit-msg", "Preencha ao menos um campo para salvar.");
  const btn = $("#b-save"); btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const col = collection(db, "users", S.user.uid, kind);
    if (item) await updateDoc(doc(col, item.id), { ...rec, atualizado: serverTimestamp() });
    else await addDoc(col, { ...rec, criado: serverTimestamp(), atualizado: serverTimestamp() });
    S.editing = null; render(); toast(item ? "Alterações salvas" : K.done);
  } catch (e) {
    console.error(e);
    setMsg("#edit-msg", e.code === "permission-denied" ? "Sem permissão para gravar. Confira as regras do Firestore." : "Não foi possível salvar. Verifique a conexão e tente de novo.");
    btn.disabled = false; btn.textContent = "Salvar";
  }
}
async function doDelete(kind, id) {
  try { await deleteDoc(doc(db, "users", S.user.uid, kind, id)); S.confirmDel = null; S.reveal.delete(id); toast("Excluído"); }
  catch { toast("Não foi possível excluir. Tente de novo."); }
}

/* ---------- events ---------- */
app.addEventListener("submit", e => {
  e.preventDefault();
  ({ "f-login": doLogin, "f-recover": doRecover, "f-setup": doSetup, "f-chpw": doChangePw, "f-edit": saveEdit })[e.target.id]?.();
});
app.addEventListener("input", e => {
  if (e.target.id === "l-pass") spinDial(e.target.value.length);
  if (e.target.id === "e-url" && /^https?:\/\//i.test(e.target.value)) e.target.value = e.target.value.replace(/^https?:\/\//i, "");
  if (e.target.id === "q") { S.query = e.target.value; render(true); }
});
app.addEventListener("click", e => {
  const t = e.target.closest("button, .scrim"); if (!t) return;
  const d = t.dataset;
  if (t.id === "scrim" && e.target === t) { S.editing = null; render(); return; }
  if (d.toggle) { const inp = $("#" + d.toggle); const show = inp.type === "password"; inp.type = show ? "text" : "password"; t.innerHTML = icon(show ? "eyeoff" : "eye"); t.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha"); return; }
  if (d.gen) { const inp = $("#" + d.gen); inp.value = genPassword(); inp.type = "text"; const tg = inp.parentElement.querySelector("[data-toggle]"); if (tg) tg.innerHTML = icon("eyeoff"); toast("Senha forte gerada"); return; }
  if (d.go) { go(d.go); return; }
  if (t.id === "b-lock" || t.id === "b-out") { S.lockNote = "Você saiu do cofre."; signOut(auth); return; }
  if (d.new) { S.editing = { kind: d.new, item: null }; render(); $("#f-edit input")?.focus(); return; }
  if (d.edit) { const [k, id] = d.edit.split("|"); S.editing = { kind: k, item: S.data[k].find(x => x.id === id) }; render(); $("#f-edit input")?.focus(); return; }
  if (t.id === "b-cancel") { S.editing = null; render(); return; }
  if (d.del) { S.confirmDel = d.del; render(); return; }
  if ("cancelDel" in d) { S.confirmDel = null; render(); return; }
  if (d.doDel) { const [k, id] = d.doDel.split("|"); doDelete(k, id); return; }
  if (d.reveal) { S.reveal.has(d.reveal) ? S.reveal.delete(d.reveal) : S.reveal.add(d.reveal); render(); return; }
  if (d.copy) {
    const [k, id, f] = d.copy.split("|"); const it = S.data[k].find(x => x.id === id);
    const labels = { login: "Login", senha: "Senha", hospedagem: "Hospedagem", banco: "Base de dados" };
    copy(it && it[f], labels[f] || "Valor"); return;
  }
});
addEventListener("keydown", e => { if (e.key === "Escape" && S.editing) { S.editing = null; render(); } });

/* ---------- install (PWA) ---------- */
let deferredPrompt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const INSTALL_KEY = "cofre-install-dismissed";
const installDismissed = () => { try { return localStorage.getItem(INSTALL_KEY) === "1"; } catch { return false; } };
function installBanner(extra = "") {
  if (isStandalone() || installDismissed()) return "";
  if (deferredPrompt) return `<div class="install ${extra}"><img src="icon-192.png" alt=""><div class="t"><strong>Instale o Cofre</strong><span>Abra direto da tela inicial, como um aplicativo.</span></div><button type="button" class="btn" data-install>Instalar</button><button type="button" class="x" data-install-x aria-label="Agora não">×</button></div>`;
  if (isIOS) return `<div class="install ${extra}"><img src="icon-192.png" alt=""><div class="t"><strong>Instale o Cofre no iPhone</strong><span>No Safari, toque em Compartilhar (quadrado com seta) e depois em “Adicionar à Tela de Início”.</span></div><button type="button" class="x" data-install-x aria-label="Fechar">×</button></div>`;
  return "";
}
const canRepaint = () => !S.editing && ["lock", "home", "logins", "apps"].includes(S.view) && !(document.activeElement && document.activeElement.type === "password" && document.activeElement.value);
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (canRepaint()) render(true); });
addEventListener("appinstalled", () => { deferredPrompt = null; toast("Aplicativo instalado"); if (canRepaint()) render(true); });
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-install],[data-install-x]"); if (!b) return;
  if ("installX" in b.dataset) { try { localStorage.setItem(INSTALL_KEY, "1"); } catch {} render(true); return; }
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch {}
  deferredPrompt = null; render(true);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- boot ---------- */
if (!configured) render();
else {
  onAuthStateChanged(auth, user => {
    if (user && normEmail(user.email) !== normEmail(ALLOWED_EMAIL)) { signOut(auth); return; }
    S.user = user || null;
    S.editing = null;
    if (user) {
      subscribe(user.uid); bumpIdle();
      S.view = ss.get(MUST_CHANGE_KEY) ? "setup" : "home";
    } else {
      unsubscribe(); clearTimeout(idleTimer);
      if (S.view !== "recover") S.view = "lock";
    }
    render();
  });
}
</script>
</body>
</html>
